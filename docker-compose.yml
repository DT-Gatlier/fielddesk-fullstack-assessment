services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fielddesk
      POSTGRES_PASSWORD: fielddesk_dev
      POSTGRES_DB: fielddesk
    ports:
      - "5433:5432"
    volumes:
      - fielddesk_assessment_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fielddesk -d fielddesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://fielddesk:fielddesk_dev@postgres:5432/fielddesk?schema=public
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:3000
    ports:
      - "4000:4000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: ./worker
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://fielddesk:fielddesk_dev@postgres:5432/fielddesk?schema=public
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  fielddesk_assessment_postgres_data:
  uploads_data:
