services:
  postgres:
    image: postgres:16-alpine
    container_name: fielddesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fielddesk
      POSTGRES_PASSWORD: fielddesk_dev_password
      POSTGRES_DB: fielddesk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fielddesk -d fielddesk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: