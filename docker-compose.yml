services:
  migrate:
    build: .
    environment: &app-environment
      DATABASE_URL: postgresql://fielddesk:fielddesk@postgres:5432/fielddesk
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      NODE_ENV: development
      ORG_STORAGE_LIMIT_BYTES: ${ORG_STORAGE_LIMIT_BYTES:-104857600}
      MOCK_NOTIFICATION_MODE: ${MOCK_NOTIFICATION_MODE:-success}
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: .
    environment: *app-environment
    ports: ["4000:4000"]
    volumes: ["fielddesk-uploads:/app/uploads"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  worker:
    build: .
    environment: *app-environment
    command: ["npm", "run", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fielddesk
      POSTGRES_PASSWORD: fielddesk
      POSTGRES_DB: fielddesk
    ports:
      - "5433:5432"
    volumes:
      - fielddesk-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fielddesk -d fielddesk"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["fielddesk-redis:/data"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  fielddesk-uploads:
  fielddesk-redis:
  fielddesk-postgres:
